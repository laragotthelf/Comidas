<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mi cocina</title><meta name="theme-color" content="#1f4d36"><link rel="icon" type="image/svg+xml" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.json">
<style>

:root[data-theme=dark]{--bg:#121a15;--card:#1b261f;--soft:#243329;--tx:#e6efe8;--mut:#93a89a;--dk:#7fc496;--on:#0f1d14;--sg:#3f6b50;--bd:#2c3d32;color-scheme:dark}

header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:24px;margin:0;color:var(--dk)}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px}.hero{background:var(--soft);border:2px solid var(--dk)}
.b{border:0;border-radius:16px;padding:12px 18px;font-size:16px;font-weight:600;background:var(--dk);color:var(--on);cursor:pointer}.b.s{background:var(--sg);color:#fff}.b.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.b.d{background:var(--r);color:#fff}.b.sm{padding:7px 12px;font-size:14px;border-radius:12px}.b:disabled{opacity:.4}

#ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}#ov.on{display:flex}#md{background:var(--card);color:var(--tx);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#ov{align-items:center}#md{border-radius:24px}}
.num{font-size:34px;font-weight:800;color:var(--dk)}details summary{cursor:pointer;font-weight:600;padding:6px 0}
.big{font-size:30px;font-weight:800;line-height:1;text-align:right;color:var(--dk);min-width:70px}.big small{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}.cg{color:var(--g)}.cy{color:var(--y)}.cr{color:var(--r)}
.sel{background:var(--soft)!important;outline:2px solid var(--dk);border-radius:12px}[data-s]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#sb:empty{display:none}#sb{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--dk);color:var(--on);border-radius:18px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:6}#sb span{flex:1;font-weight:600}
.meal.g{background:color-mix(in srgb,var(--g) 18%,var(--card))}.meal.y{background:color-mix(in srgb,var(--y) 22%,var(--card))}.meal.r{background:color-mix(in srgb,var(--r) 20%,var(--card))}.stl::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:7px}.meal.done .stl{color:var(--mut)}.stl{font-weight:700;font-size:14px;margin:2px 0}.meal.g .stl{color:var(--g)}.meal.y .stl{color:var(--y)}.meal.r .stl{color:var(--r)}.meal.done{background:var(--soft)}
</style></head><body><div id="app"></div><div id="ov" onclick="if(event.target.id=='ov')X()"><div id="md"></div></div>
<div id="sb"></div><nav id="nav"></nav>
<script>
const K='cocina_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{n:100,recipes:[{id:1,name:'Medallón de pollo con ensalada',cat:'Almuerzo/Cena',servings:1,ings:[{name:'Pollo',qty:250,unit:'g'},{name:'Rúcula',qty:30,unit:'g'},{name:'Tomate',qty:1,unit:'u'},{name:'Aceite',qty:10,unit:'ml'}]},{name:'Arroz con pollo',id:2,cat:'Almuerzo/Cena',servings:2,ings:[{name:'Arroz',qty:200,unit:'g'},{name:'Pollo',qty:300,unit:'g'}]}],inv:[{id:3,name:'Pollo',cat:'carnes',qty:1000,unit:'g',min:300,loc:'freezer'},{id:4,name:'Arroz',cat:'almacén',qty:500,unit:'g',min:200,loc:'alacena'},{id:5,name:'Tomate',cat:'verduras',qty:4,unit:'u',min:2,loc:'heladera'},{id:6,name:'Aceite',cat:'almacén',qty:500,unit:'ml',min:100,loc:'alacena'}],plan:[],shop:[],log:[],hist:[]};
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const mon=d=>{d=new Date(d);d.setHours(12);d.setDate(d.getDate()-(d.getDay()+6)%7);return d},addD=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
let tab='home',ws=mon(new Date()),q='',cf='';
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],SL={d:'Desayuno',a:'Almuerzo',m:'Merienda',c:'Cena'},SO=['d','a','m','c'],cap=s=>s.charAt(0).toUpperCase()+s.slice(1),cmp=(a,b)=>a.date.localeCompare(b.date)||SO.indexOf(a.slot)-SO.indexOf(b.slot);
let cs=0,SEL=null,SELT='',EX=new Set(),lp=0,tm,KS=[];
const D=()=>cs?(S.spaces.find(x=>x.id==cs)||S):S,bf=x=>x.unit=='paq'&&x.eq?x.eq*U[x.pu][1]:U[x.unit][1],ik=x=>x.unit=='paq'&&x.eq?key(x.name,x.pu):key(x.name,x.unit),sc=(t,id)=>SEL&&SELT==t&&SEL.has(String(id))?' sel':'',IL=k=>cs&&D().src[k]=='main'?S.inv:D().inv;
S.spaces=S.spaces||[];const CM={Almuerzo:'Almuerzo/Cena',Cena:'Almuerzo/Cena',Desayuno:'Desayuno/Merienda',Merienda:'Desayuno/Merienda'};
[S,...S.spaces].forEach(w=>{w.inv.forEach(i=>{i.cat=cap(i.cat);i.name=cap(i.name)});w.shop.forEach(x=>{x.cat=cap(x.cat);x.name=cap(x.name)})});
S.recipes.forEach(r=>{r.cat=CM[cap(r.cat)]||cap(r.cat);r.ings.forEach(i=>i.name=cap(i.name))});
const U={g:['g',1],kg:['g',1000],ml:['ml',1],l:['ml',1000],u:['u',1],paq:['paq',1]},UO=Object.keys(U).map(u=>`<option>${u}</option>`).join('');
const IC=['Carnes','Lácteos','Verduras','Frutas','Pastas','Almacén','Congelados','Bebidas','Limpieza','Otros'],RC=['Almuerzo/Cena','Desayuno/Merienda','Otro'];
const opts=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const uid=()=>++S.n,key=(n,u)=>n.toLowerCase().trim()+'|'+U[u][0],e2=s=>String(s).replace(/[<>&"]/g,'');
const fmt=(v,g)=>{v=+v.toFixed(2);if(g=='g'&&v>=1000)return +(v/1000).toFixed(2)+' kg';if(g=='ml'&&v>=1000)return +(v/1000).toFixed(2)+' l';return v+' '+g};
const rec=id=>S.recipes.find(r=>r.id==id),pend=()=>D().plan.filter(m=>!m.done);
const log=m=>{D().log.unshift({t:Date.now(),m});D().log=D().log.slice(0,80)};
const ings=m=>{const r=rec(m.rid);if(!r)return[];const f=m.people/r.servings;return r.ings.map(i=>{let u=i.unit,q=i.qty*f;if(u=='paq'){const e=[...D().inv,...S.inv].find(x=>x.eq&&x.name.toLowerCase()==i.name.toLowerCase());if(e){q*=e.eq;u=e.pu}}return{name:i.name,q,u}})};
function needs(){const N={};pend().forEach(m=>ings(m).forEach(i=>{const k=key(i.name,i.u);N[k]=N[k]||{name:i.name,g:U[i.u][0],v:0};N[k].v+=i.q*U[i.u][1]}));return N}
function status(){const st={...stock()},R={};pend().sort(cmp).forEach(m=>{const I=ings(m),miss=[];I.forEach(i=>{const k=key(i.name,i.u),n=i.q*U[i.u][1],h=Math.min(Math.max(st[k]||0,0),n);st[k]=(st[k]||0)-h;if(h<n-1e-9)miss.push({name:i.name,g:U[i.u][0],v:n-h})});R[m.id]={miss,c:!miss.length?'g':miss.length*2<=I.length?'y':'r'}});return R}
function short(){const N=needs(),T=stock();return Object.entries(N).filter(([k,n])=>n.v>(T[k]||0)+1e-9).map(([k,n])=>({k,name:n.name,g:n.g,v:n.v-(T[k]||0),cat:(D().inv.find(i=>ik(i)==k)||{}).cat||'Otros'}))}
const st=i=>i.qty<=0?['agotado','r']:i.qty<i.min?['bajo mínimo','y']:i.qty<=i.min*1.25?['por agotarse','y']:null;
const low=()=>D().inv.filter(st);
const X=()=>$('#ov').classList.remove('on'),M=h=>{$('#md').innerHTML=h;$('#ov').classList.add('on')},V=id=>$('#'+id).value;
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#121a15';r.dataset.theme=d?'light':'dark';try{localStorage.setItem('tema',r.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
const mealRow=(m,S2)=>{const r=rec(m.rid),s=S2[m.id],n=ings(m).length,k=s?s.miss.length:0,lab=m.done?'Realizada':!s?'':s.c=='g'?'Lista para preparar':`${k==1?'Falta 1 ingrediente':'Faltan '+k+' de '+n+' ingredientes'}`;return `<div class="meal ${m.done?'done':s?s.c:''}" onclick="mealM(${m.id})"><div style="flex:1"><b>${r?e2(r.name):'(receta eliminada)'}</b><div class="stl">${lab}</div>${s&&k?`<div class="mut">Falta: ${s.miss.slice(0,3).map(x=>e2(x.name)).join(', ')}${k>3?'…':''}</div>`:''}</div><span class="mut f0" style="white-space:nowrap">${m.people} pers.</span></div>`};
const views={
home(){const S2=status(),td=iso(new Date()),d=D(),t=d.plan.filter(m=>m.date==td).sort(cmp),nx=pend().filter(m=>m.date>td).sort(cmp).slice(0,5),sh=short().length+d.shop.filter(x=>!x.b).length,lw=low();
return (cs?`<div class="card"><h2>Pestaña: ${e2(d.name)}</h2><div class="row"><button class="b o sm" onclick="srcM()">Fuente de ingredientes</button><button class="b d sm" onclick="delSp()">Eliminar pestaña</button></div></div>`:'')+`<div class="card hero"><h2>Hoy</h2>${t.length?t.map(m=>`<div class="mut">${SL[m.slot]}</div>`+mealRow(m,S2)).join(''):'<p class="mut">No hay comidas planificadas para hoy.</p>'}<button class="b" onclick="addM('${td}','a')">+ Planificar</button></div>
<div class="row"><div class="card" onclick="go('shop')"><h2>Por comprar</h2><div class="num">${sh}</div></div><div class="card" onclick="go('inv')"><h2>Stock bajo</h2><div class="num">${lw.length}</div></div></div>
<div class="card"><h2>Próximas comidas</h2>${nx.map(m=>`<div class="mut">${DN[(new Date(m.date+'T12:00').getDay()+6)%7]} ${m.date.slice(8)} · ${SL[m.slot]}</div>`+mealRow(m,S2)).join('')||'<p class="mut">Sin próximas comidas.</p>'}</div>
${lw.length?`<div class="card"><h2>Alertas de stock</h2>${lw.map(i=>`<div class="item"><div>${e2(i.name)}<div class="mut">${+i.qty.toFixed(2)} ${i.unit} (mín. ${i.min})</div></div><span class="badge ${st(i)[1]}">${st(i)[0]}</span></div>`).join('')}</div>`:''}
<div class="card"><h2>Historial</h2><button class="b o sm" style="width:100%;margin-bottom:8px" onclick="clr('log')">🗑 Vaciar movimientos de inventario</button><p class="mut">Mantené presionado un elemento para seleccionar varios.</p>
<details><summary>Comidas realizadas</summary>${d.plan.filter(m=>m.done).sort((a,b)=>b.done-a.done).slice(0,50).map(m=>`<div class="item${sc('meal',m.id)}" data-s="meal|${m.id}"><div>${e2((rec(m.rid)||{name:'?'}).name)}<div class="mut">${m.date} · ${m.people} pers.</div></div></div>`).join('')||'<p class="mut">Nada aún</p>'}<button class="b o sm" onclick="clr('meal')">Vaciar</button></details>
<details><summary>Compras</summary>${d.hist.slice(0,50).map(h=>`<div class="item${sc('hist',h.t)}" data-s="hist|${h.t}"><div>${e2(h.m)}<div class="mut">${new Date(h.t).toLocaleDateString()}</div></div></div>`).join('')||'<p class="mut">Nada aún</p>'}<button class="b o sm" onclick="clr('hist')">Vaciar</button></details>
<details><summary>Movimientos de inventario</summary>${d.log.map(h=>`<div class="item${sc('log',h.t)}" data-s="log|${h.t}"><div>${e2(h.m)}<div class="mut">${new Date(h.t).toLocaleString()}</div></div></div>`).join('')||'<p class="mut">Nada aún</p>'}</details></div>`},
week(){const S2=status(),a=iso(ws),b=iso(addD(ws,6));return `<div class="row sp card"><button class="b o f0" onclick="ws=addD(ws,-7);R()">‹</button><b style="text-align:center">${a.slice(8)}/${a.slice(5,7)} – ${b.slice(8)}/${b.slice(5,7)}</b><button class="b o f0" onclick="ws=addD(ws,7);R()">›</button></div><button class="b s" style="margin-bottom:14px" onclick="copyW()">Copiar semana anterior</button>`+DN.map((n,i)=>{const d=iso(addD(ws,i)),o=EX.has(d),c=D().plan.filter(m=>m.date==d).length;return `<div class="card"><div class="row sp" style="cursor:pointer" onclick="tg('${d}')"><h2 style="margin:0">${n} ${d.slice(8)}</h2><span class="mut f0">${c?c+(c>1?' comidas':' comida'):'Vacío'} ${o?'▾':'▸'}</span></div>`+(o?`<div style="margin-top:10px">`+SO.map(s=>{const ms=D().plan.filter(m=>m.date==d&&m.slot==s);return `<div class="mut">${SL[s]}</div>`+ms.map(m=>mealRow(m,S2)).join('')+`<div class="empty" onclick="addM('${d}','${s}')">+ Agregar</div>`}).join('')+'</div>':'')+`</div>`}).join('')},
rec(){const l=S.recipes.filter(r=>r.name.toLowerCase().includes(q.toLowerCase())&&(!cf||r.cat==cf)),S3=stock();return `<button class="b" onclick="recM()" style="width:100%;margin-bottom:12px">+ Nueva receta</button><input placeholder="🔍 Buscar receta" value="${e2(q)}" oninput="q=this.value;R();document.querySelector('input').focus()"><div class="chips">${['',...RC].map(c=>`<div class="chip ${c==cf?'on':''}" onclick="cf='${c}';R()">${c||'Todas'}</div>`).join('')}</div>`+l.map(r=>{const ok=r.ings.every(i=>(S3[key(i.name,i.unit)]||0)>=i.qty*U[i.unit][1]);return `<div class="card"><div class="row sp"><b>${e2(r.name)}</b><span class="badge ${ok?'':'y'}">${ok?'se puede preparar':'faltan ingredientes'}</span></div><div class="mut">${r.cat} · rinde ${r.servings} · ${r.ings.length} ingredientes</div><div class="row" style="margin-top:10px"><button class="b o sm" onclick="recM(${r.id})">Editar</button><button class="b o sm" onclick="dup(${r.id})">Duplicar</button><button class="b d sm" onclick="delR(${r.id})">Eliminar</button></div></div>`}).join('')||'<p class="mut">Sin recetas.</p>'},
inv(){const N=needs(),l=D().inv.filter(i=>i.name.toLowerCase().includes(q.toLowerCase())&&(!cf||i.cat==cf));return `<button class="b" onclick="invM()" style="width:100%;margin-bottom:12px">+ Agregar producto</button><input placeholder="🔍 Buscar producto" value="${e2(q)}" oninput="q=this.value;R();document.querySelector('input').focus()"><div class="chips">${['',...IC].map(c=>`<div class="chip ${c==cf?'on':''}" onclick="cf='${c}';R()">${c||'Todos'}</div>`).join('')}</div><p class="mut">Mantené presionado un producto para seleccionar varios.</p><div class="card">`+l.map(i=>{const s=st(i),n=N[ik(i)],cm=n?n.v/bf(i):0,fr=Math.max(i.qty-cm,0);return `<div class="item${sc('inv',i.id)}" data-s="inv|${i.id}" onclick="invM(${i.id})"><div><b>${e2(i.name)}</b> ${s?`<span class="badge ${s[1]}">${s[0]}</span>`:''}<div class="mut">${i.cat}${i.loc?' · '+e2(i.loc):''}</div><div class="mut">Comprometido ${+cm.toFixed(2)} · Libre ${+fr.toFixed(2)}</div>${i.eq?`<div class="mut">1 paq = ${i.eq} ${i.pu}${i.unit=='paq'?' · total '+fmt(i.qty*bf(i),U[i.pu][0]):''}</div>`:''}</div><div class="big ${s?s[1]=='r'?'cr':'cy':''}">${+i.qty.toFixed(2)}<small>${i.unit}</small></div></div>`}).join('')+(l.length?'':'<p class="mut">Sin productos.</p>')+'</div>'},
shop(){const a=shorts().map(s=>({...s,auto:1})),m=D().shop.filter(x=>!x.b).map(x=>({...x,auto:0,k:x.id,g:U[x.unit][0],v:x.qty*U[x.unit][1]})),all=[...a,...m],cats=[...new Set(all.map(x=>x.cat))];
