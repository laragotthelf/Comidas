function pmM(m){const p=(D().ready||[]).find(x=>x.id==m.pm),S2=status()[m.id];M(`<h2>${SL[m.slot]} · ${m.date}</h2><h3 style="margin:0 0 8px">${p?e2(p.name):'Comida eliminada'}</h3><p class="mut">Comida ya preparada: no consume ingredientes, solo porciones del inventario.</p><label>Porciones a comer</label><input id="mp" type="number" min="1" value="${m.people}" ${m.done?'disabled':''}><div class="item"><div>Porciones disponibles</div><span>${p?+p.qty.toFixed(2):0}</span></div>${S2&&S2.miss.length?'<p class="mut">No alcanzan las porciones. Actualizá el inventario de comidas hechas.</p>':''}<div class="row" style="margin-top:12px">${m.done?`<button class="b s" onclick="undo(${m.id})">Deshacer consumo</button>`:`<button class="b" onclick="doneM(${m.id})">Marcar realizada</button><button class="b o" onclick="upP(${m.id})">Guardar</button>`}<button class="b d" onclick="delM(${m.id})">Eliminar</button></div>${m.done?'':`<a class="ed" style="display:block;text-align:center;margin-top:12px;font-size:14px" onclick="mvStart('meal',[${m.id}])">Mover a otra pestaña</a>`}`)}

let IQ0='';
function gcd2(a,b){return b?gcd2(b,a%b):a}
function nf(v){v=+v;if(!isFinite(v))return'0';const ng=v<0;v=Math.abs(v);const w=Math.floor(v+1e-9),fr=v-w;if(fr<1e-6||fr>1-1e-6)return(ng?'-':'')+Math.round(v);for(const d of [2,3,4,5,6,8,10,12]){const n=Math.round(fr*d);if(n>0&&n<d&&Math.abs(fr-n/d)<1e-6)return(ng?'-':'')+(w?w+' ':'')+n+'/'+d}return(ng?'-':'')+(+v.toFixed(2))}
function AM(){const srcs=[{id:0,n:'Principal',w:S},...S.spaces.map(x=>({id:x.id,n:x.name,w:x}))],STS={};srcs.forEach(s=>{const o=cs;cs=s.id;STS[s.id]=status();cs=o});return{A:srcs.flatMap((s,i)=>s.w.plan.map(m=>({m,s,i}))),STS}}
function spM(){M(`<h2>Pestañas</h2><div class="item"><div><b>Principal</b><div class="mut">No se puede editar ni eliminar</div></div></div>${S.spaces.map(x=>`<div class="item"><input id="spn${x.id}" value="${e2(x.name)}" style="margin:0;flex:1"><button class="b sm f0" onclick="renSp(${x.id})">Guardar</button><button class="b d sm f0" onclick="delSp(${x.id})">Eliminar</button></div>`).join('')}<label style="display:block;margin-top:14px">Nueva pestaña</label><input id="spn" placeholder="Ej: Cenas con mi novia"><button class="b" onclick="addSp()">Crear</button>`)}
function renSp(id){const n=cap(V('spn'+id).trim());if(!n)return alert('Ingresá un nombre');S.spaces.find(x=>x.id==id).name=n;spM();R()}
function delSp(id){if(!confirm('¿Eliminar esta pestaña con todos sus datos?'))return;S.spaces=S.spaces.filter(x=>x.id!=id);if(cs==id)cs=0;spM();R()}
{const CMAP={Carnes:'Carnes y huevos',Pastas:'Almacén'},fx=o=>{o.cat=CMAP[o.cat]||o.cat;if(!IC.includes(o.cat))o.cat='Otros'};[S,...S.spaces].forEach(w=>{w.inv.forEach(fx);w.shop.forEach(fx);Object.values(w.ov||{}).forEach(o=>{if(o.cat)fx(o)})})}

const FR=['½|1/2','⅓|1/3','¼|1/4','⅔|2/3','¾|3/4'].map(x=>{const[a,b]=x.split('|');return `<span class="fc" onclick="fc(this,'${b}')">${a}</span>`}).join(''),UF={'½':'1/2','⅓':'1/3','⅔':'2/3','¼':'1/4','¾':'3/4','⅕':'1/5','⅙':'1/6','⅛':'1/8'};
function fc(e,f){const g=e.closest('.ing'),i=g?g.querySelector('.iq'):$('#iq'),m=/^(\d+)$/.exec(i.value.trim());i.value=(m&&+m[1]>0?m[1]+' ':'')+f}
function pf(t){t=String(t).trim().replace(/[½⅓⅔¼¾⅕⅙⅛]/g,c=>' '+UF[c]).replace(/[;:÷]/g,'/').replace(',','.').trim().replace(/\s+/g,' ');if(t==='')return NaN;let m=t.match(/^(\d+) (\d+)\/(\d+)$/);if(m)return+m[3]?+m[1]+ +m[2]/+m[3]:NaN;m=t.match(/^(\d+)\/(\d+)$/);if(m)return+m[2]?+m[1]/+m[2]:NaN;return/^\d*\.?\d+$/.test(t)?+t:NaN}
function pickR(e){document.querySelectorAll('#mrl .pi').forEach(x=>x.classList.remove('on'));e.classList.add('on');$('#mr').value=e.dataset.v}
function selR(id){const e=document.querySelector('#mrl .pi[data-v="'+id+'"]');if(e){pickR(e);e.scrollIntoView({block:'nearest'})}}
function shortAll(){const sh=short(),out=[...sh];D().inv.forEach(i=>{if(i.qty>1e-7)return;const k=ik(i);if(out.some(z=>z.k==k))return;const rp=i.min>0?i.min:(i.unit=='g'||i.unit=='ml'?500:1);out.push({k,name:i.name,g:i.unit=='paq'&&i.eq?U[i.pu][0]:U[i.unit][0],v:rp*bf(i),cat:i.cat||'Otros',store:i.store||'Otros',dep:1})});return out}
let MV=null;
function mvStart(type,ids){const ds=[{id:0,n:'Principal'},...S.spaces.map(x=>({id:x.id,n:x.name}))].filter(x=>x.id!=cs);if(!ds.length)return alert('Primero creá otra pestaña (botón ✎ arriba).');MV={type,ids};M(`<h2>Mover a otra pestaña</h2><p class="mut">Se quita de "${e2(cs?D().name:'Principal')}" y pasa a la pestaña que elijas.</p>${ds.map(x=>`<button class="b o" style="width:100%;margin-bottom:8px" onclick="mvDo(${x.id})">${e2(x.n)}</button>`).join('')}`)}
function mvSel(){mvStart(SELT,[...SEL])}
function mvDo(dest){const to=dest?S.spaces.find(x=>x.id==dest):S,fr=D(),{type,ids}=MV,H=a=>ids.map(String).includes(String(a));let n=0,skip=0;
if(type=='inv'){fr.inv.filter(i=>H(i.id)).forEach(i=>{fr.inv=fr.inv.filter(z=>z!==i);const t=to.inv.find(z=>ik(z)==ik(i));if(t)t.qty=+(t.qty+i.qty*bf(i)/bf(t)).toFixed(10);else to.inv.push(i);n++})}
else if(type=='shop'){ids.forEach(t=>{if(String(t)[0]!='m'){skip++;return}const id=decodeURIComponent(String(t).slice(1)),it=fr.shop.find(z=>String(z.id)==id);if(!it)return;fr.shop=fr.shop.filter(z=>z!==it);const x=to.shop.find(z=>!z.b&&key(z.name,z.unit)==key(it.name,it.unit));if(x)x.qty=+(x.qty+it.qty*U[it.unit][1]/U[x.unit][1]).toFixed(10);else to.shop.push(it);n++})}
else if(type=='rdy'){to.ready=to.ready||[];(fr.ready||[]).filter(p=>H(p.id)).forEach(p=>{fr.ready=fr.ready.filter(z=>z!==p);const t=to.ready.find(z=>z.name.toLowerCase()==p.name.toLowerCase());if(t)t.qty+=p.qty;else to.ready.push(p);n++})}
else if(type=='meal'){const m=fr.plan.find(z=>z.id==ids[0]);if(m){fr.plan=fr.plan.filter(z=>z!==m);if(m.pm){const p=(fr.ready||[]).find(x=>x.id==m.pm);if(p){to.ready=to.ready||[];let q=to.ready.find(x=>x.name.toLowerCase()==p.name.toLowerCase());if(!q){q={id:uid(),name:p.name,qty:0};to.ready.push(q)}m.pm=q.id}}to.plan.push(m);n++}}
if(n)log('Movido a "'+(dest?to.name:'Principal')+'": '+n+' elemento(s)');MV=null;SEL=null;X();R();if(skip)alert(skip+' producto(s) calculados desde comidas planificadas no se pueden mover (dependen de la planificación de esta pestaña).')}

R();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
